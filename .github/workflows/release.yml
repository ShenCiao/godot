name: Ciallo Godot Release

# The workflow dispatch ref picker does not select release code. Every release
# is built from the current origin/ciallo commit and its generated tag.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ciallo-godot-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Tag ciallo release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.release.outputs.ref }}
      sha: ${{ steps.release.outputs.sha }}
      status: ${{ steps.release.outputs.status }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout ciallo
        uses: actions/checkout@v5
        with:
          ref: ciallo
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Read version and create release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin +refs/heads/ciallo:refs/remotes/origin/ciallo --tags
          git checkout --detach origin/ciallo
          head_sha="$(git rev-parse HEAD)"

          read -r major minor patch upstream_status < <(
            python -c 'import version; print(version.major, version.minor, version.patch, version.status)'
          )
          if [ "$upstream_status" != "stable" ]; then
            echo "Refusing to release Godot status '$upstream_status'; version.py must be stable."
            exit 1
          fi

          godot_version="$major.$minor.$patch"
          version_status="ciallo.g$(git rev-parse --short=9 HEAD)"
          base_tag="v${godot_version}-ciallo"
          last_number=0
          existing_tag=""

          while IFS= read -r tag; do
            suffix="${tag#"$base_tag."}"
            if [[ ! "$suffix" =~ ^[1-9][0-9]*$ ]]; then
              continue
            fi
            if (( suffix > last_number )); then
              last_number="$suffix"
            fi
            if [ "$(git rev-list -n 1 "$tag")" = "$head_sha" ]; then
              existing_tag="$tag"
            fi
          done < <(git tag --list "${base_tag}.*" --sort=version:refname)

          if [ -n "$existing_tag" ]; then
            release_tag="$existing_tag"
            echo "Reusing $release_tag for origin/ciallo@$head_sha."
          else
            release_tag="${base_tag}.$((last_number + 1))"
            git config user.name "${{ github.actor }}"
            git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
            git tag -a "$release_tag" "$head_sha" -m "Ciallo Godot $godot_version ($version_status)"
            git push origin "refs/tags/$release_tag"
            echo "Created $release_tag for origin/ciallo@$head_sha."
          fi

          {
            echo "ref=$release_tag"
            echo "sha=$head_sha"
            echo "status=$version_status"
            echo "tag=$release_tag"
          } >> "$GITHUB_OUTPUT"
          echo "Using version status '$version_status'."

  build:
    name: Build release artifacts
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/_build.yml
    with:
      source_ref: ${{ needs.prepare.outputs.ref }}
      source_sha: ${{ needs.prepare.outputs.sha }}
      version_status: ${{ needs.prepare.outputs.status }}
      produce_artifacts: true

  publish-feed:
    name: Publish SDK feed
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Download SDK NuGet packages
        uses: actions/download-artifact@v6
        with:
          name: godot-sdk-nupkgs-${{ needs.prepare.outputs.status }}
          path: nupkgs_out

      - name: Publish SDK packages to static NuGet feed
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION_STATUS: ${{ needs.prepare.outputs.status }}
        run: |
          set -euo pipefail

          dotnet tool install --global Sleet
          export PATH="$PATH:$HOME/.dotnet/tools"

          FEED_DIR="$RUNNER_TEMP/feed"
          git clone --branch gh-pages --single-branch \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$FEED_DIR"

          cat > "$RUNNER_TEMP/sleet.json" <<'JSON'
          {
            "sources": [
              {
                "name": "feed",
                "type": "local",
                "path": "FEED_DIR_PLACEHOLDER",
                "baseURI": "https://shenciao.github.io/godot/"
              }
            ]
          }
          JSON
          sed -i "s#FEED_DIR_PLACEHOLDER#${FEED_DIR}#" "$RUNNER_TEMP/sleet.json"

          sleet init --config "$RUNNER_TEMP/sleet.json" --source feed || true
          sleet push ./nupkgs_out --config "$RUNNER_TEMP/sleet.json" --source feed --force
          touch "$FEED_DIR/.nojekyll"

          cd "$FEED_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Feed unchanged; nothing to commit."
          else
            git commit -m "Publish SDK packages for $VERSION_STATUS"
            git push origin gh-pages
          fi

      - name: Upload static NuGet feed Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/feed

  deploy-pages:
    name: Deploy static NuGet feed to Pages
    needs: publish-feed
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000

  publish-release:
    name: Publish GitHub Release
    needs: [prepare, build, deploy-pages]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: godot-*
          path: packages
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: |
            packages/*.zip
          fail_on_unmatched_files: true
