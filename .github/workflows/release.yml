name: Ciallo Godot Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_status:
        description: "Optional GODOT_VERSION_STATUS override. Defaults to ciallo.g<short-sha>."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf8
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONAN_HOME: ${{ github.workspace }}/.conan2

jobs:
  windows-build:
    name: Windows Editor
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download Direct3D 12 SDK components
        id: d3d12-sdk
        shell: bash
        run: |
          if python ./misc/scripts/install_d3d12_sdk_windows.py; then
            echo "enabled=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Direct3D 12 SDK installation failed; building without D3D12 support."
            echo "enabled=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Download pre-built ANGLE static libraries
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: godotengine/godot-angle-static
          version: tags/chromium/6601.2
          file: godot-angle-static-x86_64-msvc-release.zip
          target: angle/angle.zip

      - name: Extract pre-built ANGLE static libraries
        shell: pwsh
        run: Expand-Archive -Force angle/angle.zip ${{ github.workspace }}/

      - name: Restore Conan cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan2-${{ runner.os }}-cgal-x86_64-cppstd17-${{ hashFiles('modules/arrangement_2d/conan.lock') }}
          restore-keys: |
            conan2-${{ runner.os }}-cgal-x86_64-cppstd17-

      - name: Install Conan
        shell: bash
        run: |
          python -m pip install "conan>=2,<3"
          conan --version

      - name: Install CGAL Conan Dependencies
        shell: bash
        run: |
          conan profile detect --force
          rm -rf modules/arrangement_2d/conan_installed
          conan install modules/arrangement_2d \
            --lockfile=modules/arrangement_2d/conan.lock \
            --build=missing \
            --output-folder=modules/arrangement_2d/conan_installed \
            -s:h compiler.cppstd=17 \
            -s:b compiler.cppstd=17 \
            -s:h arch=x86_64

      - name: Compute version status
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.version_status }}" ]; then
            STATUS="${{ inputs.version_status }}"
          else
            STATUS="ciallo.g$(git rev-parse --short=9 HEAD)"
          fi
          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
          echo "GODOT_VERSION_STATUS=${STATUS}"

      - name: Build editor
        shell: bash
        env:
          BUILD_NAME: ciallo
          GODOT_VERSION_STATUS: ${{ steps.ver.outputs.status }}
        run: |
          scons platform=windows target=editor \
            module_mono_enabled=yes \
            windows_subsystem=console \
            debug_symbols=no \
            accesskit=no \
            "angle_libs=${{ github.workspace }}/" \
            d3d12=${{ steps.d3d12-sdk.outputs.enabled }}
          ls -l bin/

      - name: Locate .NET editor binary
        id: editor
        shell: bash
        run: |
          EDITOR_BIN="$(find ./bin -maxdepth 1 -type f -name 'godot.windows.editor*.mono*' \
            ! -name '*.console.exe' ! -name '*.console' ! -name '*.pdb' ! -name '*.lib' ! -name '*.exp' \
            | sort | head -n1)"
          if [ -z "$EDITOR_BIN" ]; then
            echo "Could not find .NET editor binary in bin/"; ls -l bin/; exit 1
          fi
          echo "path=${EDITOR_BIN}" >> "$GITHUB_OUTPUT"
          echo "Editor binary: ${EDITOR_BIN}"

      - name: Generate C# glue
        shell: bash
        run: |
          "${{ steps.editor.outputs.path }}" --headless --generate-mono-glue modules/mono/glue

      - name: Build .NET assemblies and bundled NuGet packages
        shell: bash
        env:
          GODOT_VERSION_STATUS: ${{ steps.ver.outputs.status }}
        run: |
          mkdir -p ./bin/GodotSharp/Tools/nupkgs
          python modules/mono/build_scripts/build_assemblies.py \
            --godot-output-dir ./bin \
            --godot-platform=windows \
            --push-nupkgs-local ./bin/GodotSharp/Tools/nupkgs

      - name: Verify bundled NuGet packages
        shell: bash
        run: |
          VERSION="$(python -c 'import version; print(f"{version.major}.{version.minor}.{version.patch}")')-${{ steps.ver.outputs.status }}"
          test -f "./bin/GodotSharp/Tools/nupkgs/Godot.NET.Sdk.${VERSION}.nupkg"
          test -f "./bin/GodotSharp/Tools/nupkgs/Godot.SourceGenerators.${VERSION}.nupkg"
          test -f "./bin/GodotSharp/Tools/nupkgs/GodotSharp.${VERSION}.nupkg"
          test -f "./bin/GodotSharp/Tools/nupkgs/GodotSharpEditor.${VERSION}.nupkg"
          ls -lh ./bin/GodotSharp/Tools/nupkgs/

      - name: Package editor and bundled C# packages
        id: package
        shell: bash
        run: |
          rm -f bin/*.exp bin/*.lib bin/*.pdb 2>/dev/null || true
          ARCHIVE="godot-windows-x86_64-${{ steps.ver.outputs.status }}.zip"
          7z a "$ARCHIVE" ./bin/* >/dev/null
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          ls -lh "$ARCHIVE"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-windows-x86_64-${{ steps.ver.outputs.status }}
          path: ${{ steps.package.outputs.archive }}

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.archive }}
          fail_on_unmatched_files: true

  linux-build:
    name: Linux Editor
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwayland-bin \
            libx11-dev libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev \
            libwayland-dev libgl1-mesa-dev libglu1-mesa-dev libasound2-dev \
            libpulse-dev libudev-dev libxkbcommon-dev

      - name: Restore Conan cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan2-${{ runner.os }}-cgal-x86_64-cppstd17-${{ hashFiles('modules/arrangement_2d/conan.lock') }}
          restore-keys: |
            conan2-${{ runner.os }}-cgal-x86_64-cppstd17-

      - name: Install Conan
        shell: bash
        run: |
          python -m pip install "conan>=2,<3"
          conan --version

      - name: Install CGAL Conan Dependencies
        shell: bash
        run: |
          conan profile detect --force
          rm -rf modules/arrangement_2d/conan_installed
          conan install modules/arrangement_2d \
            --lockfile=modules/arrangement_2d/conan.lock \
            --build=missing \
            --output-folder=modules/arrangement_2d/conan_installed \
            -s:h compiler.cppstd=17 \
            -s:b compiler.cppstd=17 \
            -s:h arch=x86_64

      - name: Compute version status
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.version_status }}" ]; then
            STATUS="${{ inputs.version_status }}"
          else
            STATUS="ciallo.g$(git rev-parse --short=9 HEAD)"
          fi
          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
          echo "GODOT_VERSION_STATUS=${STATUS}"

      - name: Build editor
        shell: bash
        env:
          BUILD_NAME: ciallo
          GODOT_VERSION_STATUS: ${{ steps.ver.outputs.status }}
        run: |
          scons platform=linuxbsd target=editor \
            module_mono_enabled=yes \
            debug_symbols=no \
            accesskit=no
          ls -l bin/

      - name: Locate .NET editor binary
        id: editor
        shell: bash
        run: |
          EDITOR_BIN="$(find ./bin -maxdepth 1 -type f -name 'godot.linuxbsd.editor*.mono*' \
            ! -name '*.console.exe' ! -name '*.console' ! -name '*.pdb' ! -name '*.lib' ! -name '*.exp' \
            | sort | head -n1)"
          if [ -z "$EDITOR_BIN" ]; then
            echo "Could not find .NET editor binary in bin/"; ls -l bin/; exit 1
          fi
          echo "path=${EDITOR_BIN}" >> "$GITHUB_OUTPUT"
          echo "Editor binary: ${EDITOR_BIN}"

      - name: Generate C# glue
        shell: bash
        run: |
          "${{ steps.editor.outputs.path }}" --headless --generate-mono-glue modules/mono/glue

      - name: Build .NET assemblies and bundled NuGet packages
        shell: bash
        env:
          GODOT_VERSION_STATUS: ${{ steps.ver.outputs.status }}
        run: |
          mkdir -p ./bin/GodotSharp/Tools/nupkgs
          python modules/mono/build_scripts/build_assemblies.py \
            --godot-output-dir ./bin \
            --godot-platform=linuxbsd \
            --push-nupkgs-local ./bin/GodotSharp/Tools/nupkgs

      - name: Verify bundled NuGet packages
        shell: bash
        run: |
          VERSION="$(python -c 'import version; print(f"{version.major}.{version.minor}.{version.patch}")')-${{ steps.ver.outputs.status }}"
          test -f "./bin/GodotSharp/Tools/nupkgs/Godot.NET.Sdk.${VERSION}.nupkg"
          test -f "./bin/GodotSharp/Tools/nupkgs/Godot.SourceGenerators.${VERSION}.nupkg"
          test -f "./bin/GodotSharp/Tools/nupkgs/GodotSharp.${VERSION}.nupkg"
          test -f "./bin/GodotSharp/Tools/nupkgs/GodotSharpEditor.${VERSION}.nupkg"
          ls -lh ./bin/GodotSharp/Tools/nupkgs/

      - name: Package editor and bundled C# packages
        id: package
        shell: bash
        run: |
          strip bin/godot.* 2>/dev/null || true
          chmod +x bin/godot.* 2>/dev/null || true
          ARCHIVE="godot-linuxbsd-x86_64-${{ steps.ver.outputs.status }}.zip"
          (cd bin && zip -r "../$ARCHIVE" . >/dev/null)
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          ls -lh "$ARCHIVE"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-linuxbsd-x86_64-${{ steps.ver.outputs.status }}
          path: ${{ steps.package.outputs.archive }}

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.archive }}
          fail_on_unmatched_files: true

  macos-build:
    name: macOS Editor
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore Conan cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan2-${{ runner.os }}-cgal-armv8-cppstd17-${{ hashFiles('modules/arrangement_2d/conan.lock') }}
          restore-keys: |
            conan2-${{ runner.os }}-cgal-armv8-cppstd17-

      - name: Install Conan
        shell: bash
        run: |
          python -m pip install "conan>=2,<3"
          conan --version

      - name: Install CGAL Conan Dependencies
        shell: bash
        run: |
          conan profile detect --force
          rm -rf modules/arrangement_2d/conan_installed
          conan install modules/arrangement_2d \
            --lockfile=modules/arrangement_2d/conan.lock \
            --build=missing \
            --output-folder=modules/arrangement_2d/conan_installed \
            -s:h compiler.cppstd=17 \
            -s:b compiler.cppstd=17 \
            -s:h arch=armv8

      - name: Setup Vulkan SDK
        id: vulkan-sdk
        shell: bash
        run: |
          if sh misc/scripts/install_vulkan_sdk_macos.sh; then
            echo "enabled=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::macOS Vulkan SDK installation failed; building without Vulkan support."
            echo "enabled=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute version status
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.version_status }}" ]; then
            STATUS="${{ inputs.version_status }}"
          else
            STATUS="ciallo.g$(git rev-parse --short=9 HEAD)"
          fi
          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
          echo "GODOT_VERSION_STATUS=${STATUS}"

      - name: Build editor
        shell: bash
        env:
          BUILD_NAME: ciallo
          GODOT_VERSION_STATUS: ${{ steps.ver.outputs.status }}
        run: |
          scons platform=macos target=editor arch=arm64 \
            module_mono_enabled=yes \
            debug_symbols=no \
            accesskit=no \
            vulkan=${{ steps.vulkan-sdk.outputs.enabled }}
          ls -l bin/

      - name: Locate .NET editor binary
        id: editor
        shell: bash
        run: |
          EDITOR_BIN="$(find ./bin -maxdepth 1 -type f -name 'godot.macos.editor*.mono*' \
            ! -name '*.console.exe' ! -name '*.console' ! -name '*.pdb' ! -name '*.lib' ! -name '*.exp' \
            | sort | head -n1)"
          if [ -z "$EDITOR_BIN" ]; then
            echo "Could not find .NET editor binary in bin/"; ls -l bin/; exit 1
          fi
          echo "path=${EDITOR_BIN}" >> "$GITHUB_OUTPUT"
          echo "Editor binary: ${EDITOR_BIN}"

      - name: Generate C# glue
        shell: bash
        run: |
          "${{ steps.editor.outputs.path }}" --headless --generate-mono-glue modules/mono/glue

      - name: Build .NET assemblies and bundled NuGet packages
        shell: bash
        env:
          GODOT_VERSION_STATUS: ${{ steps.ver.outputs.status }}
        run: |
          mkdir -p ./bin/GodotSharp/Tools/nupkgs
          python modules/mono/build_scripts/build_assemblies.py \
            --godot-output-dir ./bin \
            --godot-platform=macos \
            --push-nupkgs-local ./bin/GodotSharp/Tools/nupkgs

      - name: Verify bundled NuGet packages
        shell: bash
        run: |
          VERSION="$(python -c 'import version; print(f"{version.major}.{version.minor}.{version.patch}")')-${{ steps.ver.outputs.status }}"
          test -f "./bin/GodotSharp/Tools/nupkgs/Godot.NET.Sdk.${VERSION}.nupkg"
          test -f "./bin/GodotSharp/Tools/nupkgs/Godot.SourceGenerators.${VERSION}.nupkg"
          test -f "./bin/GodotSharp/Tools/nupkgs/GodotSharp.${VERSION}.nupkg"
          test -f "./bin/GodotSharp/Tools/nupkgs/GodotSharpEditor.${VERSION}.nupkg"
          ls -lh ./bin/GodotSharp/Tools/nupkgs/

      - name: Package editor and bundled C# packages
        id: package
        shell: bash
        run: |
          strip bin/godot.* 2>/dev/null || true
          chmod +x bin/godot.* 2>/dev/null || true
          ARCHIVE="godot-macos-arm64-${{ steps.ver.outputs.status }}.zip"
          (cd bin && zip -r "../$ARCHIVE" . >/dev/null)
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          ls -lh "$ARCHIVE"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-macos-arm64-${{ steps.ver.outputs.status }}
          path: ${{ steps.package.outputs.archive }}

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.archive }}
          fail_on_unmatched_files: true
