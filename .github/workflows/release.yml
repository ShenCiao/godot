name: Ciallo Godot Release

# The workflow dispatch ref picker does not select release code. Every release
# builds the current origin/ciallo commit before creating its immutable tag.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ciallo-godot-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve ciallo release
    runs-on: ubuntu-22.04
    outputs:
      ref: ${{ steps.release.outputs.ref }}
      sha: ${{ steps.release.outputs.sha }}
      status: ${{ steps.release.outputs.status }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout ciallo
        uses: actions/checkout@v5
        with:
          ref: ciallo
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin +refs/heads/ciallo:refs/remotes/origin/ciallo --tags
          git checkout --detach origin/ciallo
          head_sha="$(git rev-parse HEAD)"

          read -r major minor patch upstream_status < <(
            python -c 'import version; print(version.major, version.minor, version.patch, version.status)'
          )
          if [ "$upstream_status" != "stable" ]; then
            echo "Refusing to release Godot status '$upstream_status'; version.py must be stable."
            exit 1
          fi

          godot_version="$major.$minor.$patch"
          version_status="ciallo.g$(git rev-parse --short=9 HEAD)"
          release_tag="v${godot_version}-${version_status}"

          {
            echo "ref=$head_sha"
            echo "sha=$head_sha"
            echo "status=$version_status"
            echo "tag=$release_tag"
          } >> "$GITHUB_OUTPUT"
          echo "Using version status '$version_status'."

  build:
    name: Build release artifacts
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/_build.yml
    with:
      source_ref: ${{ needs.prepare.outputs.ref }}
      source_sha: ${{ needs.prepare.outputs.sha }}
      version_status: ${{ needs.prepare.outputs.status }}
      produce_artifacts: true

  tag:
    name: Create immutable release tag
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Create tag
        env:
          GODOT_VERSION_STATUS: ${{ needs.prepare.outputs.status }}
          HEAD_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin --tags
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            tagged_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [ "$tagged_sha" != "$HEAD_SHA" ]; then
              echo "Immutable tag $RELEASE_TAG already points to $tagged_sha, not $HEAD_SHA."
              exit 1
            fi
            echo "Reusing $RELEASE_TAG at $HEAD_SHA."
            exit 0
          fi

          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$HEAD_SHA" -m "Ciallo Godot $RELEASE_TAG ($GODOT_VERSION_STATUS)"
          git push origin "refs/tags/$RELEASE_TAG"

  publish-release:
    name: Publish GitHub Release
    needs: [prepare, build, tag]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: godot-*
          path: packages
          merge-multiple: true

      - name: Checkout packaging scripts
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: source

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Package editors, optional templates, and release registry
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          python source/misc/scripts/package_gdvm.py \
            --packages packages --output release \
            --version "${RELEASE_TAG#v}" --repository "$GITHUB_REPOSITORY"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: |
            release/*.zip
            release/*.json
          fail_on_unmatched_files: true
