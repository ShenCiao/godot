name: Ciallo Godot Build

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact commit or tag to build.
        required: true
        type: string
      source_sha:
        description: Full source commit SHA used for cache keys.
        required: true
        type: string
      version_status:
        description: GODOT_VERSION_STATUS for this build.
        required: true
        type: string
      produce_artifacts:
        description: Package and upload release artifacts.
        required: true
        type: boolean

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf8
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONAN_HOME: ${{ github.workspace }}/.conan2
  SCONS_CACHE: ${{ github.workspace }}/.scons_cache/

jobs:
  windows-build:
    name: Windows Editor
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Download Direct3D 12 SDK components
        id: d3d12-sdk
        shell: bash
        run: |
          if python ./misc/scripts/install_d3d12_sdk_windows.py; then
            echo "enabled=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Direct3D 12 SDK installation failed; building without D3D12 support."
            echo "enabled=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup arrangement_2d Conan dependencies
        uses: ./.github/actions/arrangement-conan
        with:
          arch: x86_64

      - name: Restore SCons cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.SCONS_CACHE }}
          key: scons-windows-editor|${{ github.event.repository.default_branch }}|${{ inputs.source_sha }}
          restore-keys: |
            scons-windows-editor|${{ github.event.repository.default_branch }}|

      - name: Build editor
        shell: bash
        env:
          BUILD_NAME: ciallo
          GODOT_VERSION_STATUS: ${{ inputs.version_status }}
        run: |
          scons platform=windows target=editor \
            windows_subsystem=console \
            d3d12=${{ steps.d3d12-sdk.outputs.enabled }} \
            "cache_path=${SCONS_CACHE}" \
            redirect_build_objects=no
          ls -l bin/

      - name: Save SCons cache
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ env.SCONS_CACHE }}
          key: scons-windows-editor|${{ github.event.repository.default_branch }}|${{ inputs.source_sha }}

      - name: Locate .NET editor binary
        id: editor
        shell: bash
        run: |
          EDITOR_BIN="$(find ./bin -maxdepth 1 -type f -name 'godot.windows.editor*.mono*' \
            ! -name '*.console.exe' ! -name '*.console' ! -name '*.pdb' ! -name '*.lib' ! -name '*.exp' \
            | sort | head -n1)"
          if [ -z "$EDITOR_BIN" ]; then
            echo "Could not find .NET editor binary in bin/"; ls -l bin/; exit 1
          fi
          echo "path=${EDITOR_BIN}" >> "$GITHUB_OUTPUT"
          echo "Editor binary: ${EDITOR_BIN}"

      - name: Generate C# glue
        shell: bash
        run: |
          "${{ steps.editor.outputs.path }}" --headless --generate-mono-glue modules/mono/glue

      - name: Build .NET assemblies
        shell: bash
        env:
          GODOT_VERSION_STATUS: ${{ inputs.version_status }}
        run: |
          python modules/mono/build_scripts/build_assemblies.py \
            --godot-output-dir ./bin \
            --godot-platform=windows \
            --no-deprecated

      - name: Package editor
        if: inputs.produce_artifacts
        id: package
        shell: bash
        run: |
          rm -rf bin/build_deps bin/obj
          rm -f bin/*.exp bin/*.lib bin/*.pdb 2>/dev/null || true
          ARCHIVE="godot-windows-x86_64-${{ inputs.version_status }}.zip"
          7z a "$ARCHIVE" ./bin/* >/dev/null
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          ls -lh "$ARCHIVE"

      - name: Upload build artifact
        if: inputs.produce_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: godot-windows-x86_64-${{ inputs.version_status }}
          path: ${{ steps.package.outputs.archive }}

  linux-build:
    name: Linux Editor
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwayland-bin \
            libx11-dev libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev \
            libwayland-dev libgl1-mesa-dev libglu1-mesa-dev libasound2-dev \
            libpulse-dev libudev-dev libxkbcommon-dev

      - name: Setup arrangement_2d Conan dependencies
        uses: ./.github/actions/arrangement-conan
        with:
          arch: x86_64

      - name: Restore SCons cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.SCONS_CACHE }}
          key: scons-linux-editor|${{ github.event.repository.default_branch }}|${{ inputs.source_sha }}
          restore-keys: |
            scons-linux-editor|${{ github.event.repository.default_branch }}|

      - name: Build editor
        shell: bash
        env:
          BUILD_NAME: ciallo
          GODOT_VERSION_STATUS: ${{ inputs.version_status }}
        run: |
          scons platform=linuxbsd target=editor \
            "cache_path=${SCONS_CACHE}" \
            redirect_build_objects=no
          ls -l bin/

      - name: Save SCons cache
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ env.SCONS_CACHE }}
          key: scons-linux-editor|${{ github.event.repository.default_branch }}|${{ inputs.source_sha }}

      - name: Locate .NET editor binary
        id: editor
        shell: bash
        run: |
          EDITOR_BIN="$(find ./bin -maxdepth 1 -type f -name 'godot.linuxbsd.editor*.mono*' \
            ! -name '*.console.exe' ! -name '*.console' ! -name '*.pdb' ! -name '*.lib' ! -name '*.exp' \
            | sort | head -n1)"
          if [ -z "$EDITOR_BIN" ]; then
            echo "Could not find .NET editor binary in bin/"; ls -l bin/; exit 1
          fi
          echo "path=${EDITOR_BIN}" >> "$GITHUB_OUTPUT"
          echo "Editor binary: ${EDITOR_BIN}"

      - name: Generate C# glue
        shell: bash
        run: |
          "${{ steps.editor.outputs.path }}" --headless --generate-mono-glue modules/mono/glue

      - name: Upload C# glue (for template builds)
        uses: actions/upload-artifact@v7
        with:
          name: mono-glue
          path: modules/mono/glue/
          if-no-files-found: error
          retention-days: 1

      - name: Build .NET assemblies and SDK NuGet packages
        shell: bash
        env:
          GODOT_VERSION_STATUS: ${{ inputs.version_status }}
        run: |
          mkdir -p ./nupkgs_out
          python modules/mono/build_scripts/build_assemblies.py \
            --godot-output-dir ./bin \
            --godot-platform=linuxbsd \
            --push-nupkgs-local ./nupkgs_out \
            --no-deprecated

      - name: Verify SDK NuGet packages
        shell: bash
        run: |
          VERSION="$(python -c 'import version; print(f"{version.major}.{version.minor}.{version.patch}")')-${{ inputs.version_status }}"
          test -f "./nupkgs_out/Godot.NET.Sdk.${VERSION}.nupkg"
          test -f "./nupkgs_out/Godot.SourceGenerators.${VERSION}.nupkg"
          test -f "./nupkgs_out/GodotSharp.${VERSION}.nupkg"
          test -f "./nupkgs_out/GodotSharpEditor.${VERSION}.nupkg"
          ls -lh ./nupkgs_out/

      - name: Upload SDK NuGet packages
        if: inputs.produce_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: godot-sdk-nupkgs-${{ inputs.version_status }}
          path: nupkgs_out/*.nupkg
          if-no-files-found: error

      - name: Package editor
        if: inputs.produce_artifacts
        id: package
        shell: bash
        run: |
          rm -rf ./bin/build_deps ./bin/obj
          strip bin/godot.* 2>/dev/null || true
          chmod +x bin/godot.* 2>/dev/null || true
          ARCHIVE="godot-linuxbsd-x86_64-${{ inputs.version_status }}.zip"
          (cd bin && zip -r "../$ARCHIVE" . >/dev/null)
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          ls -lh "$ARCHIVE"

      - name: Upload build artifact
        if: inputs.produce_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: godot-linuxbsd-x86_64-${{ inputs.version_status }}
          path: ${{ steps.package.outputs.archive }}

  macos-build:
    name: macOS Editor
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Setup arrangement_2d Conan dependencies
        uses: ./.github/actions/arrangement-conan
        with:
          arch: armv8

      - name: Setup Vulkan SDK
        id: vulkan-sdk
        shell: bash
        run: |
          if sh misc/scripts/install_vulkan_sdk_macos.sh; then
            echo "enabled=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::macOS Vulkan SDK installation failed; building without Vulkan support."
            echo "enabled=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore SCons cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.SCONS_CACHE }}
          key: scons-macos-editor|${{ github.event.repository.default_branch }}|${{ inputs.source_sha }}
          restore-keys: |
            scons-macos-editor|${{ github.event.repository.default_branch }}|

      - name: Build editor
        shell: bash
        env:
          BUILD_NAME: ciallo
          GODOT_VERSION_STATUS: ${{ inputs.version_status }}
        run: |
          scons platform=macos target=editor arch=arm64 \
            vulkan=${{ steps.vulkan-sdk.outputs.enabled }} \
            "cache_path=${SCONS_CACHE}" \
            redirect_build_objects=no
          ls -l bin/

      - name: Save SCons cache
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ env.SCONS_CACHE }}
          key: scons-macos-editor|${{ github.event.repository.default_branch }}|${{ inputs.source_sha }}

      - name: Locate .NET editor binary
        id: editor
        shell: bash
        run: |
          EDITOR_BIN="$(find ./bin -maxdepth 1 -type f -name 'godot.macos.editor*.mono*' \
            ! -name '*.console.exe' ! -name '*.console' ! -name '*.pdb' ! -name '*.lib' ! -name '*.exp' \
            | sort | head -n1)"
          if [ -z "$EDITOR_BIN" ]; then
            echo "Could not find .NET editor binary in bin/"; ls -l bin/; exit 1
          fi
          echo "path=${EDITOR_BIN}" >> "$GITHUB_OUTPUT"
          echo "Editor binary: ${EDITOR_BIN}"

      - name: Generate C# glue
        shell: bash
        run: |
          "${{ steps.editor.outputs.path }}" --headless --generate-mono-glue modules/mono/glue

      - name: Build .NET assemblies
        shell: bash
        env:
          GODOT_VERSION_STATUS: ${{ inputs.version_status }}
        run: |
          python modules/mono/build_scripts/build_assemblies.py \
            --godot-output-dir ./bin \
            --godot-platform=macos \
            --no-deprecated

      - name: Package editor
        if: inputs.produce_artifacts
        id: package
        shell: bash
        run: |
          rm -rf ./bin/build_deps ./bin/obj
          strip bin/godot.* 2>/dev/null || true
          chmod +x bin/godot.* 2>/dev/null || true
          ARCHIVE="godot-macos-arm64-${{ inputs.version_status }}.zip"
          (cd bin && zip -r "../$ARCHIVE" . >/dev/null)
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          ls -lh "$ARCHIVE"

      - name: Upload build artifact
        if: inputs.produce_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: godot-macos-arm64-${{ inputs.version_status }}
          path: ${{ steps.package.outputs.archive }}

  # ---------------------------------------------------------------------------
  # Export templates
  #
  # Templates reuse the C# glue generated by the Linux editor job (glue is
  # platform-independent, generated once, shared via the "mono-glue" artifact).
  # Build flags follow godotengine/godot's official CI for export templates:
  # only `debug_symbols=no` (NOT `production=yes`, which bloats binaries — see
  # the "avoid-production-yes-build-flag" project memory). 3D physics/navigation
  # are disabled here (templates only; the editor rejects these flags).
  # ---------------------------------------------------------------------------

  windows-templates:
    name: Windows Export Templates
    needs: linux-build
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Download C# glue
        uses: actions/download-artifact@v6
        with:
          name: mono-glue
          path: modules/mono/glue/

      - name: Download Direct3D 12 SDK components
        id: d3d12-sdk
        shell: bash
        run: |
          if python ./misc/scripts/install_d3d12_sdk_windows.py; then
            echo "enabled=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Direct3D 12 SDK installation failed; building without D3D12 support."
            echo "enabled=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup arrangement_2d Conan dependencies
        uses: ./.github/actions/arrangement-conan
        with:
          arch: x86_64

      - name: Restore SCons cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.SCONS_CACHE }}
          key: scons-windows-templates|${{ github.event.repository.default_branch }}|${{ inputs.source_sha }}
          restore-keys: |
            scons-windows-templates|${{ github.event.repository.default_branch }}|

      - name: Build export templates
        shell: bash
        env:
          BUILD_NAME: ciallo
          GODOT_VERSION_STATUS: ${{ inputs.version_status }}
        run: |
          for TARGET in template_release template_debug; do
            scons platform=windows target=$TARGET arch=x86_64 \
              d3d12=${{ steps.d3d12-sdk.outputs.enabled }} \
              debug_symbols=no \
              disable_physics_3d=yes disable_navigation_3d=yes \
              "cache_path=${SCONS_CACHE}" \
              redirect_build_objects=no
          done
          ls -l bin/

      - name: Save SCons cache
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ env.SCONS_CACHE }}
          key: scons-windows-templates|${{ github.event.repository.default_branch }}|${{ inputs.source_sha }}

      - name: Package export templates
        if: inputs.produce_artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = Get-ChildItem -LiteralPath bin -File -Filter "godot.windows.template_release.x86_64*.exe" |
            Where-Object { $_.Name -notlike "*.console.exe" } |
            Sort-Object Name |
            Select-Object -First 1
          $debug = Get-ChildItem -LiteralPath bin -File -Filter "godot.windows.template_debug.x86_64*.exe" |
            Where-Object { $_.Name -notlike "*.console.exe" } |
            Sort-Object Name |
            Select-Object -First 1
          if (-not $release -or -not $debug) {
            throw "Windows export template binaries were not found."
          }

          $version = python -c 'import version; print(f"{version.major}.{version.minor}.{version.patch}")'
          New-Item -ItemType Directory -Path templates | Out-Null
          Copy-Item -LiteralPath $release.FullName -Destination templates/windows_release_x86_64.exe
          Copy-Item -LiteralPath $debug.FullName -Destination templates/windows_debug_x86_64.exe
          "$version.${{ inputs.version_status }}.mono" | Set-Content -LiteralPath templates/version.txt

          $archive = "godot-export-templates-windows-x86_64-${{ inputs.version_status }}.zip"
          Compress-Archive -LiteralPath templates -DestinationPath $archive
          Get-Item -LiteralPath $archive | Format-List Name, Length

      - name: Upload template archive
        if: inputs.produce_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: godot-export-templates-windows-x86_64-${{ inputs.version_status }}
          path: godot-export-templates-windows-x86_64-${{ inputs.version_status }}.zip
          if-no-files-found: error
          compression-level: 0

  linux-templates:
    name: Linux Export Templates
    needs: linux-build
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwayland-bin \
            libx11-dev libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev \
            libwayland-dev libgl1-mesa-dev libglu1-mesa-dev libasound2-dev \
            libpulse-dev libudev-dev libxkbcommon-dev

      - name: Download C# glue
        uses: actions/download-artifact@v6
        with:
          name: mono-glue
          path: modules/mono/glue/

      - name: Setup arrangement_2d Conan dependencies
        uses: ./.github/actions/arrangement-conan
        with:
          arch: x86_64

      - name: Restore SCons cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.SCONS_CACHE }}
          key: scons-linux-templates|${{ github.event.repository.default_branch }}|${{ inputs.source_sha }}
          restore-keys: |
            scons-linux-templates|${{ github.event.repository.default_branch }}|

      - name: Build export templates
        shell: bash
        env:
          BUILD_NAME: ciallo
          GODOT_VERSION_STATUS: ${{ inputs.version_status }}
        run: |
          for TARGET in template_release template_debug; do
            scons platform=linuxbsd target=$TARGET arch=x86_64 \
              debug_symbols=no \
              disable_physics_3d=yes disable_navigation_3d=yes \
              "cache_path=${SCONS_CACHE}" \
              redirect_build_objects=no
          done
          ls -l bin/

      - name: Save SCons cache
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ env.SCONS_CACHE }}
          key: scons-linux-templates|${{ github.event.repository.default_branch }}|${{ inputs.source_sha }}

      - name: Package export templates
        if: inputs.produce_artifacts
        shell: bash
        run: |
          set -euo pipefail
          REL="$(find ./bin -maxdepth 1 -type f -name 'godot.linuxbsd.template_release.x86_64*' ! -name '*.so' | sort | head -n1)"
          DBG="$(find ./bin -maxdepth 1 -type f -name 'godot.linuxbsd.template_debug.x86_64*' ! -name '*.so' | sort | head -n1)"
          test -n "$REL" && test -n "$DBG"
          strip "$REL" "$DBG" 2>/dev/null || true

          VER="$(python -c 'import version; print(f"{version.major}.{version.minor}.{version.patch}")')"
          mkdir -p templates
          cp "$REL" templates/linux_release.x86_64
          cp "$DBG" templates/linux_debug.x86_64
          chmod +x templates/linux_release.x86_64 templates/linux_debug.x86_64
          printf '%s\n' "${VER}.${{ inputs.version_status }}.mono" > templates/version.txt

          ARCHIVE="godot-export-templates-linux-x86_64-${{ inputs.version_status }}.zip"
          zip -r -q "$ARCHIVE" templates
          unzip -l "$ARCHIVE"

      - name: Upload template archive
        if: inputs.produce_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: godot-export-templates-linux-x86_64-${{ inputs.version_status }}
          path: godot-export-templates-linux-x86_64-${{ inputs.version_status }}.zip
          if-no-files-found: error
          compression-level: 0

  macos-templates:
    name: macOS Export Templates
    needs: linux-build
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Download C# glue
        uses: actions/download-artifact@v6
        with:
          name: mono-glue
          path: modules/mono/glue/

      - name: Setup arrangement_2d Conan dependencies
        uses: ./.github/actions/arrangement-conan
        with:
          arch: armv8

      - name: Setup Vulkan SDK
        id: vulkan-sdk
        shell: bash
        run: |
          if sh misc/scripts/install_vulkan_sdk_macos.sh; then
            echo "enabled=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::macOS Vulkan SDK installation failed; building without Vulkan support."
            echo "enabled=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore SCons cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.SCONS_CACHE }}
          key: scons-macos-templates|${{ github.event.repository.default_branch }}|${{ inputs.source_sha }}
          restore-keys: |
            scons-macos-templates|${{ github.event.repository.default_branch }}|

      - name: Build export templates
        shell: bash
        env:
          BUILD_NAME: ciallo
          GODOT_VERSION_STATUS: ${{ inputs.version_status }}
        run: |
          for TARGET in template_release template_debug; do
            scons platform=macos target=$TARGET arch=arm64 \
              vulkan=${{ steps.vulkan-sdk.outputs.enabled }} \
              debug_symbols=no \
              disable_physics_3d=yes disable_navigation_3d=yes \
              "cache_path=${SCONS_CACHE}" \
              redirect_build_objects=no
          done
          ls -l bin/

      - name: Package arm64 export templates
        if: inputs.produce_artifacts
        shell: bash
        env:
          BUILD_NAME: ciallo
          GODOT_VERSION_STATUS: ${{ inputs.version_status }}
        run: |
          set -euo pipefail
          scons platform=macos target=template_release arch=arm64 \
            vulkan=${{ steps.vulkan-sdk.outputs.enabled }} \
            debug_symbols=no \
            disable_physics_3d=yes disable_navigation_3d=yes \
            generate_bundle=yes \
            "cache_path=${SCONS_CACHE}" \
            redirect_build_objects=no

          BUNDLE="$(find ./bin -maxdepth 1 -type f -name 'godot_macos*.zip' | sort | head -n1)"
          test -n "$BUNDLE"
          mkdir -p templates staging
          unzip -q "$BUNDLE" -d staging

          REL="staging/macos_template.app/Contents/MacOS/godot_macos_release.universal"
          DBG="staging/macos_template.app/Contents/MacOS/godot_macos_debug.universal"
          test "$(lipo -archs "$REL")" = "arm64"
          test "$(lipo -archs "$DBG")" = "arm64"
          mv "$REL" staging/macos_template.app/Contents/MacOS/godot_macos_release.arm64
          mv "$DBG" staging/macos_template.app/Contents/MacOS/godot_macos_debug.arm64
          chmod +x staging/macos_template.app/Contents/MacOS/godot_macos_*.arm64
          (cd staging && zip -r -q ../templates/macos.zip macos_template.app)

          VER="$(python -c 'import version; print(f"{version.major}.{version.minor}.{version.patch}")')"
          printf '%s\n' "${VER}.${{ inputs.version_status }}.mono" > templates/version.txt
          ARCHIVE="godot-export-templates-macos-arm64-${{ inputs.version_status }}.zip"
          zip -r -q "$ARCHIVE" templates
          unzip -l templates/macos.zip | grep 'godot_macos_.*\.arm64'
          unzip -l "$ARCHIVE"

      - name: Save SCons cache
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ env.SCONS_CACHE }}
          key: scons-macos-templates|${{ github.event.repository.default_branch }}|${{ inputs.source_sha }}

      - name: Upload template archive
        if: inputs.produce_artifacts
        uses: actions/upload-artifact@v7
        with:
          name: godot-export-templates-macos-arm64-${{ inputs.version_status }}
          path: godot-export-templates-macos-arm64-${{ inputs.version_status }}.zip
          if-no-files-found: error
          compression-level: 0
